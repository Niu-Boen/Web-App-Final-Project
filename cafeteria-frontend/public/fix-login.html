<!DOCTYPE html>
<html>
<head>
    <title>修复登录</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 10px; padding: 15px 20px; font-size: 16px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        pre { background: #f8f9fa; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>登录问题修复工具</h1>
    
    <button onclick="step1()" style="background: #dc3545; color: white;">第1步: 清除所有缓存</button>
    <button onclick="step2()" style="background: #007bff; color: white;">第2步: 测试API连接</button>
    <button onclick="step3()" style="background: #28a745; color: white;">第3步: 执行登录测试</button>
    <button onclick="step4()" style="background: #6c757d; color: white;">第4步: 跳转到应用</button>
    
    <div id="result" style="margin-top: 20px;"></div>

    <script>
        function log(message, type = 'info') {
            const div = document.getElementById('result');
            const p = document.createElement('div');
            p.className = type;
            p.style.padding = '10px';
            p.style.margin = '5px 0';
            p.innerHTML = message;
            div.appendChild(p);
            console.log(message);
        }

        function step1() {
            localStorage.clear();
            sessionStorage.clear();
            log('✅ 所有缓存已清除', 'success');
        }

        async function step2() {
            try {
                const response = await fetch('/api/categories');
                if (response.ok) {
                    log('✅ API连接正常', 'success');
                } else {
                    log('❌ API连接失败: ' + response.status, 'error');
                }
            } catch (error) {
                log('❌ API连接错误: ' + error.message, 'error');
            }
        }

        async function step3() {
            try {
                log('🔄 正在测试登录...', 'info');
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@apiu.edu',
                        password: 'password'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success && data.data) {
                    localStorage.setItem('token', data.data.token);
                    log('✅ 登录成功！用户: ' + data.data.user.name + ' (' + data.data.user.role + ')', 'success');
                    log('Token已保存到localStorage', 'success');
                } else {
                    log('❌ 登录失败: ' + (data.message || '未知错误'), 'error');
                    log('<pre>' + JSON.stringify(data, null, 2) + '</pre>', 'error');
                }
            } catch (error) {
                log('❌ 登录错误: ' + error.message, 'error');
            }
        }

        function step4() {
            const token = localStorage.getItem('token');
            if (token) {
                log('✅ 检测到token，跳转到应用...', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                log('❌ 没有找到token，请先执行第3步', 'error');
            }
        }

        // 页面加载时检查状态
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                log('ℹ️ 检测到现有token: ' + token.substring(0, 20) + '...', 'info');
            } else {
                log('ℹ️ 没有检测到token', 'info');
            }
        };
    </script>
</body>
</html>
