<!DOCTYPE html>
<html>
<head>
    <title>Debug Search API</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: #f8f9fa; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Debug Search API</h1>
    
    <div>
        <button onclick="testLogin()">1. Test Login</button>
        <button onclick="testSearchEmpty()">2. Test Search (Empty)</button>
        <button onclick="testSearchA()">3. Test Search (a)</button>
        <button onclick="testSearchAdmin()">4. Test Search (admin)</button>
    </div>
    
    <div id="results"></div>

    <script>
        let token = null;
        
        function addResult(title, content, isError = false) {
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testLogin() {
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@apiu.edu',
                        password: 'password'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    token = data.data.token;
                    addResult('Login Success', `Token: ${token.substring(0, 20)}...\nUser: ${data.data.user.name}`);
                } else {
                    addResult('Login Failed', JSON.stringify(data, null, 2), true);
                }
            } catch (error) {
                addResult('Login Error', error.message, true);
            }
        }
        
        async function testSearchEmpty() {
            if (!token) {
                addResult('Search Error', 'Please login first', true);
                return;
            }
            
            try {
                const response = await fetch('/api/trusted-friends/search-users', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                addResult(`Search Empty (Status: ${response.status})`, JSON.stringify(data, null, 2), !data.success);
            } catch (error) {
                addResult('Search Empty Error', error.message, true);
            }
        }
        
        async function testSearchA() {
            if (!token) {
                addResult('Search Error', 'Please login first', true);
                return;
            }
            
            try {
                const response = await fetch('/api/trusted-friends/search-users?search=a', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                addResult(`Search 'a' (Status: ${response.status})`, JSON.stringify(data, null, 2), !data.success);
            } catch (error) {
                addResult('Search A Error', error.message, true);
            }
        }
        
        async function testSearchAdmin() {
            if (!token) {
                addResult('Search Error', 'Please login first', true);
                return;
            }
            
            try {
                const response = await fetch('/api/trusted-friends/search-users?search=admin', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                addResult(`Search 'admin' (Status: ${response.status})`, JSON.stringify(data, null, 2), !data.success);
            } catch (error) {
                addResult('Search Admin Error', error.message, true);
            }
        }
    </script>
</body>
</html>
