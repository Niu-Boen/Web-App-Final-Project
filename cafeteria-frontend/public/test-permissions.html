<!DOCTYPE html>
<html>
<head>
    <title>Test Permissions</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: #f8f9fa; padding: 10px; overflow: auto; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Test Permissions</h1>
    
    <div>
        <button onclick="testFinanceLogin()">1. Login as Finance</button>
        <button onclick="testAdminLogin()">2. Login as Admin</button>
        <button onclick="testFinanceUsers()">3. Test Finance Users API</button>
        <button onclick="testAdminUsers()">4. Test Admin Users API</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>

    <script>
        let token = null;
        
        function addResult(title, content, isError = false) {
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
            document.getElementById('results').appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testFinanceLogin() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'finance@apiu.edu',
                        password: 'password'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    token = data.data.token;
                    addResult('✅ Finance Login Success', `Token: ${token.substring(0, 20)}...\nUser: ${data.data.user.name}\nRole: ${data.data.user.role}`);
                } else {
                    addResult('❌ Finance Login Failed', JSON.stringify(data, null, 2), true);
                }
            } catch (error) {
                addResult('❌ Finance Login Error', error.message, true);
            }
        }
        
        async function testAdminLogin() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@apiu.edu',
                        password: 'password'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    token = data.data.token;
                    addResult('✅ Admin Login Success', `Token: ${token.substring(0, 20)}...\nUser: ${data.data.user.name}\nRole: ${data.data.user.role}`);
                } else {
                    addResult('❌ Admin Login Failed', JSON.stringify(data, null, 2), true);
                }
            } catch (error) {
                addResult('❌ Admin Login Error', error.message, true);
            }
        }
        
        async function testFinanceUsers() {
            if (!token) {
                addResult('❌ Error', 'Please login first', true);
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/finance/users', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                addResult(`Finance Users API (Status: ${response.status})`, 
                    `Success: ${data.success}\nMessage: ${data.message || 'N/A'}\nUsers: ${data.data ? data.data.length : 0}`, 
                    !data.success);
            } catch (error) {
                addResult('❌ Finance Users Error', error.message, true);
            }
        }
        
        async function testAdminUsers() {
            if (!token) {
                addResult('❌ Error', 'Please login first', true);
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/admin/users', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                addResult(`Admin Users API (Status: ${response.status})`, 
                    `Success: ${data.success}\nMessage: ${data.message || 'N/A'}\nUsers: ${data.data ? data.data.length : 0}`, 
                    !data.success);
            } catch (error) {
                addResult('❌ Admin Users Error', error.message, true);
            }
        }
    </script>
</body>
</html>
