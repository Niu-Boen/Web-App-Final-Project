<!DOCTYPE html>
<html>
<head>
    <title>Clear Storage</title>
</head>
<body>
    <h1>Clear Storage and Test Login</h1>
    <button onclick="clearStorage()">Clear localStorage</button>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('result').innerHTML = 'Storage cleared!';
        }

        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing login...';
            
            try {
                console.log('Starting login test...');
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@apiu.edu',
                        password: 'password'
                    })
                });
                
                console.log('Response received:', response);
                console.log('Status:', response.status);
                console.log('OK:', response.ok);
                
                const data = await response.json();
                console.log('Data:', data);
                
                if (data.success && data.data) {
                    localStorage.setItem('token', data.data.token);
                    resultDiv.innerHTML = `
                        <h3>✅ Login Successful!</h3>
                        <p>Status: ${response.status}</p>
                        <p>User: ${data.data.user.name}</p>
                        <p>Role: ${data.data.user.role}</p>
                        <p>Token stored: ${data.data.token.substring(0, 20)}...</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ Login Failed</h3>
                        <p>Status: ${response.status}</p>
                        <p>Message: ${data.message}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
